# SPDX-License-Identifier: MPL-2.0
name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m pip install .
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Regression tests against built CLI
        shell: bash
        run: |
          if [ -f build/Release/triton-agent1.exe ]; then
            export TRITON_C_BINARY="$PWD/build/Release/triton-agent1.exe"
          else
            export TRITON_C_BINARY="$PWD/build/triton-agent1"
          fi
          python run_tests.py
      - run: python -m build
      - name: Verify installed wheel in isolated environment
        run: python scripts/check_wheel.py
      - name: Prepare platform archive
        if: matrix.python == '3.13'
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: release-${{ matrix.os }}
          path: |
            artifacts/*.zip
            dist/*.whl
            dist/*.tar.gz
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTRITON_SANITIZE=ON -DCMAKE_C_COMPILER=clang
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
      - run: python run_tests.py
        env:
          TRITON_C_BINARY: ${{ github.workspace }}/build/triton-agent1
          ASAN_OPTIONS: detect_leaks=1

  npm-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm test
      - run: npm pack --dry-run
